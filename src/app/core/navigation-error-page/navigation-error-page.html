<div class="flex flex-col items-center gap-4 py-24 text-center">
  <h1 class="text-4xl font-bold tracking-tight">{{ 'navigationError.title' | transloco }}</h1>
  <p class="max-w-xl text-lg text-(--muted-foreground)">
    {{ 'navigationError.description' | transloco }}
  </p>
  <button
    class="mt-2 inline-flex items-center justify-center rounded-md bg-(--primary) px-4 py-2 text-sm font-medium text-(--primary-foreground) transition-colors hover:bg-(--primary)/90"
    type="button"
    (click)="reload()"
  >
    {{ 'navigationError.reload' | transloco }}
  </button>
</div>
