map $uri $cache_control {
    ~^/(main|chunk|styles|polyfills)-[A-Za-z0-9_-]+\.(js|css)$ "public, max-age=31536000, immutable";
    ~^/media/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }
}
