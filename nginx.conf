server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Angular client-side routing: unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point; hashed asset filenames handle cache-busting for the rest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
